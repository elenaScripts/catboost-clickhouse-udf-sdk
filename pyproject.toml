[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catboost-clickhouse-udf-sdk"
version = "0.1.0"
description = "Package CatBoost models as ClickHouse executable Python UDFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["catboost>=1.2,<2"]

[project.optional-dependencies]
demo = ["catboost==1.2.10", "clickhousectl==0.6.0"]
test = ["pytest>=8,<10"]

[project.scripts]
catboost-ch = "chcatboost.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
