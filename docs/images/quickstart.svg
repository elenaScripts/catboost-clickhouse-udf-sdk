<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Score an event in SQL</title>
  <desc id="desc">A SQL query passes four example arguments to the configured incident_risk function in ClickHouse and receives a score. The model and input are synthetic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e7ebf0"/></marker>
    <style>
      .heading{font:600 18px system-ui,-apple-system,sans-serif;fill:#f2f3f5}.code{font:16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f2f3f5}.small{font:14px system-ui,-apple-system,sans-serif;fill:#c1cad6}.arrow{fill:none;stroke:#e7ebf0;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="380" fill="#191b1f"/>
  <text x="50" y="51" class="heading">SQL arguments</text>
  <rect x="50" y="70" width="385" height="205" fill="#252b34" stroke="#8795a6" stroke-width="1.3"/>
  <path d="M270 70V275M50 121H435M50 172H435M50 223H435" fill="none" stroke="#697587"/>
  <text x="67" y="102" class="code">service</text><text x="287" y="102" class="code">checkout</text>
  <text x="67" y="153" class="code">error_code</text><text x="287" y="153" class="code">500</text>
  <text x="67" y="204" class="code">response_ms</text><text x="287" y="204" class="code">1600</text>
  <text x="67" y="255" class="code">retry_count</text><text x="287" y="255" class="code">2</text>
  <path d="M435 173H530" class="arrow"/>
  <text x="545" y="51" class="heading">ClickHouse</text>
  <rect x="545" y="70" width="270" height="205" fill="none" stroke="#a4aebc" stroke-width="1.3"/>
  <rect x="568" y="131" width="224" height="84" fill="#373729" stroke="#f1d451" stroke-width="1.3"/>
  <text x="680" y="181" text-anchor="middle" class="code">incident_risk(…)</text>
  <path d="M815 173H910" class="arrow"/>
  <text x="925" y="51" class="heading">SQL result</text>
  <rect x="925" y="117" width="145" height="110" fill="#252b34" stroke="#8795a6" stroke-width="1.3"/>
  <rect x="925" y="117" width="145" height="48" fill="#354156"/>
  <path d="M925 165H1070" stroke="#8795a6"/>
  <text x="941" y="147" class="code">risk</text><text x="941" y="202" class="code">0.14917…</text>
  <text x="50" y="332" class="small">Synthetic example; score depends on the model.</text>
</svg>
