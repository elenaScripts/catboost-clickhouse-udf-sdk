<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">How a SQL query gets a model prediction</title>
  <desc id="desc">A sequence diagram read from top to bottom. First, the SQL client sends a query to ClickHouse. Second, ClickHouse sends feature rows to an external Python worker over standard input. Third, the worker returns one score per row over standard output. Fourth, ClickHouse returns the query result to the client. Each worker loads its model at startup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e5e9ef"/></marker>
    <style>
      .heading{font:600 19px system-ui,-apple-system,sans-serif;fill:#f0f2f5}.sub{font:15px system-ui,-apple-system,sans-serif;fill:#c4cbd5}.message{font:17px system-ui,-apple-system,sans-serif;fill:#f0f2f5}.detail{font:14px system-ui,-apple-system,sans-serif;fill:#c4cbd5}.code{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e8eaf0}.number{font:600 15px system-ui,-apple-system,sans-serif;fill:#17191d}.life{stroke:#78828f;stroke-width:1.3;stroke-dasharray:5 7}.arrow{fill:none;stroke:#e5e9ef;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="720" fill="#191b1f"/>
  <!-- Participants are fixed in columns; messages are read from top to bottom. -->
  <rect x="65" y="40" width="270" height="82" fill="#303640" stroke="#a5aebb" stroke-width="1.4"/>
  <text x="200" y="75" text-anchor="middle" class="heading">SQL client</text><text x="200" y="101" text-anchor="middle" class="sub">runs the query</text>
  <rect x="425" y="40" width="270" height="82" fill="#303a4d" stroke="#88a2d2" stroke-width="1.4"/>
  <text x="560" y="75" text-anchor="middle" class="heading">ClickHouse server</text><text x="560" y="101" text-anchor="middle" class="sub">executes the query</text>
  <rect x="785" y="40" width="270" height="82" fill="#373729" stroke="#f1d451" stroke-width="1.4"/>
  <text x="920" y="75" text-anchor="middle" class="heading">Python UDF worker</text><text x="920" y="101" text-anchor="middle" class="sub">loads model at startup</text>
  <path d="M200 122V654M560 122V654M920 122V654" class="life"/>
  <text x="46" y="163" class="sub">Time ↓</text>
  <!-- 1: the user's SQL request. -->
  <circle cx="240" cy="186" r="13" fill="#f1d451"/><text x="240" y="191" text-anchor="middle" class="number">1</text>
  <text x="263" y="183" class="message">Run a SQL query</text>
  <text x="263" y="205" class="code">SELECT incident_risk(…)</text>
  <path d="M200 225H551" class="arrow"/>
  <!-- 2: feature rows serialized for the external executable. -->
  <circle cx="600" cy="296" r="13" fill="#f1d451"/><text x="600" y="301" text-anchor="middle" class="number">2</text>
  <text x="623" y="293" class="message">Send a block of feature rows</text>
  <text x="623" y="315" class="detail">stdin: row count + TabSeparated</text>
  <path d="M560 335H911" class="arrow"/>
  <!-- 3: one prediction for every input row. -->
  <circle cx="600" cy="406" r="13" fill="#f1d451"/><text x="600" y="411" text-anchor="middle" class="number">3</text>
  <text x="623" y="403" class="message">Return one score per row</text>
  <text x="623" y="425" class="detail">stdout: Float64 scores</text>
  <path d="M920 445H569" class="arrow"/>
  <!-- 4: the client receives the SQL result. -->
  <circle cx="240" cy="516" r="13" fill="#f1d451"/><text x="240" y="521" text-anchor="middle" class="number">4</text>
  <text x="263" y="513" class="message">Return the SQL result</text>
  <text x="263" y="535" class="code">risk = 0.14917…</text>
  <path d="M560 555H209" class="arrow"/>
  <text x="65" y="685" class="detail">Example score from the synthetic quickstart model. The worker is a separate executable process.</text>
</svg>
